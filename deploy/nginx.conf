# Production server for solarityai.com (see Dockerfile). It serves the
# generated dist/ directory, applies the rules dist/_headers declares (nginx
# does not read that file), and keeps the previous site's public URLs working.
# deploy/smoke_test.py verifies this behavior against a running container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers stay correct behind the TLS proxies.
    absolute_redirect off;
    server_tokens off;
    autoindex off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml text/javascript application/javascript
               application/json application/xml image/svg+xml image/x-icon;

    error_page 404 /404.html;

    # Previous site URLs. /index.html is matched on the original request,
    # because the index directive rewrites "/" to /index.html internally.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 /;
    }
    location = /careers.html { return 301 /careers/; }
    location = /blog.html { return 301 /; }
    location = /legal.html { return 301 /contact/; }
    location = /docs/xtract-demo.html { return 301 /; }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Host configuration for other static hosts; not public content here.
    location = /_headers { return 404; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Pages revalidate on every request, so a deploy is visible immediately.
    # Directory routes without a slash get a 301 to the slash URL.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /favicon.ico {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Content-addressed build outputs never change once published.
    location ^~ /assets/optimized/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        location ~* \.avif$ {
            types { }
            default_type image/avif;
        }
    }

    location ^~ /assets/runtime/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /assets/fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        # Quoted: an unquoted "{12}" would be parsed as a block.
        location ~ "\.[0-9a-f]{12}\.woff2$" {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # Other assets (full-size screenshots, social image) are not fingerprinted.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
