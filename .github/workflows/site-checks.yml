name: Site checks

on:
  pull_request:
  merge_group:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; develop runs always finish.
concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Pillow
        run: python -m pip install -r requirements.txt

      - name: Rebuild the site
        run: python build_site.py

      - name: Committed build outputs match their sources
        run: |
          outputs="dist site-pages.json design/presentation.css research-assets/page-dates.json research-assets/performance-build.json"
          if [ -n "$(git status --porcelain -- $outputs)" ]; then
            git status --porcelain -- $outputs
            echo "::error title=Stale build output::Run python build_site.py and commit dist/ and the other build outputs."
            exit 1
          fi

      - name: Static audit
        run: |
          status=0
          python check_site.py > static-audit-ci.json || status=$?
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          audit = json.load(open('static-audit-ci.json', encoding='utf-8'))
          errors, warnings = audit.get('errors', []), audit.get('warnings', [])
          print('### Static audit')
          print(f'{len(errors)} errors · {len(warnings)} warnings')
          for item in errors:
              print(f'- {item}')
          PY
          exit "$status"

      - name: Python tests
        run: python -m unittest test_optimize_styles.py test_site_urls.py test_seo.py

      - name: Node tests
        run: node --test test-navigation.cjs test-contact.cjs test-gallery.cjs test-careers.cjs test-copy.cjs
