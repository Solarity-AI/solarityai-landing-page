name: Site checks

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Pillow
        run: python -m pip install -r requirements.txt

      - name: Rebuild the site
        run: python build_site.py

      - name: Committed dist matches its sources
        run: git diff --exit-code --stat -- dist

      - name: Static audit
        run: python check_site.py

      - name: Python tests
        run: python -m unittest test_optimize_styles.py test_site_urls.py

      - name: Node tests
        run: node --test test-navigation.cjs test-contact.cjs test-gallery.cjs test-careers.cjs

  server:
    name: Production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t solarityai-site .

      - name: Start the container
        run: |
          docker run -d --name site -p 8080:80 solarityai-site
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          exit 1

      - name: Validate the nginx configuration
        run: docker exec site nginx -t

      - name: Smoke test routes, redirects, headers and MIME types
        run: python3 deploy/smoke_test.py http://localhost:8080

      - name: Show server logs on failure
        if: failure()
        run: docker logs site
