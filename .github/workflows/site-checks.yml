name: Site checks

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; main runs always finish.
concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Pillow
        run: python -m pip install -r requirements.txt

      - name: Rebuild the site
        run: python build_site.py

      - name: Committed build outputs match their sources
        run: |
          outputs="dist site-pages.json design/presentation.css research-assets/page-dates.json research-assets/performance-build.json"
          if [ -n "$(git status --porcelain -- $outputs)" ]; then
            git status --porcelain -- $outputs
            echo "::error title=Stale build output::Run python build_site.py and commit dist/ and the other build outputs."
            exit 1
          fi

      - name: Static audit
        run: |
          status=0
          python check_site.py > static-audit-ci.json || status=$?
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          audit = json.load(open('static-audit-ci.json', encoding='utf-8'))
          errors, warnings = audit.get('errors', []), audit.get('warnings', [])
          print('### Static audit')
          print(f'{len(errors)} errors · {len(warnings)} warnings')
          for item in errors:
              print(f'- {item}')
          PY
          exit "$status"

      - name: Python tests
        # Every test file runs, so a new one needs no workflow edit (validate.py does the same locally).
        run: python -m unittest test_*.py

      - name: Node tests
        run: node --test test-*.cjs
