name: Site checks

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Pillow
        run: python -m pip install -r requirements.txt

      - name: Rebuild the site
        run: python build_site.py

      - name: Committed dist matches its sources
        run: git diff --exit-code --stat -- dist

      - name: Static audit
        run: python check_site.py

      - name: Python tests
        run: python -m unittest test_optimize_styles.py test_site_urls.py

      - name: Node tests
        run: node --test test-navigation.cjs test-contact.cjs test-gallery.cjs test-careers.cjs

