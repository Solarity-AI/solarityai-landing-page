name: IndexNow

# After a production deploy, tell IndexNow engines (Bing, which also feeds ChatGPT search and
# Copilot, plus Yandex, Seznam and Naver) which pages changed. Google reads the sitemap instead.
on:
  push:
    branches:
      - develop
    paths:
      - dist/sitemap.xml
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page, not only changed ones
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit changed pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Submit to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          previous=HEAD~1
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then previous="$BEFORE"; fi
          python deploy/indexnow.py --previous "$previous" ${{ inputs.all && '--all' || '' }}
