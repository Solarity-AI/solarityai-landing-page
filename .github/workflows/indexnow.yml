name: IndexNow

# After a production deploy, tell IndexNow engines (Bing, which also feeds ChatGPT search and
# Copilot, plus Yandex, Seznam and Naver) which pages changed. Google reads the sitemap instead.
on:
  push:
    branches:
      - develop
    paths:
      - dist/sitemap.xml
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page, not only changed ones
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit changed pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Submit to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          previous=HEAD~1
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then previous="$BEFORE"; fi
          python deploy/indexnow.py --previous "$previous" ${{ inputs.all && '--all' || '' }}
