name: Preview

# Every branch gets a Cloudflare Pages preview. This waits until the pull request's preview serves its
# committed dist/, smoke-tests it, and records Lighthouse reports (informational: lab scores vary by runner).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Smoke test and Lighthouse
    # Pull requests from forks have no preview deployment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Preview address
        id: url
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Cloudflare's branch alias: lowercase, runs of other characters become "-", at most 28 characters.
          alias=$(python -c "import os,re;a=re.sub(r'[^a-z0-9]+','-',os.environ['BRANCH'].lower()).strip('-');print(a[:28].strip('-'))")
          echo "url=https://${alias}.solarityai-landing-page.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Wait for the preview, then smoke-test it
        env:
          PREVIEW: ${{ steps.url.outputs.url }}
        run: |
          for attempt in $(seq 1 24); do
            if python deploy/smoke_test.py "$PREVIEW" > smoke.txt 2>&1; then
              cat smoke.txt
              { echo "### Preview: $PREVIEW"; echo; tail -n 2 smoke.txt; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # 404 means Cloudflare has no deployment at this alias yet (or its build failed);
            # 200 means the preview exists but does not match this commit's dist/ yet.
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PREVIEW/" || echo 000)
            echo "Attempt $attempt: $PREVIEW/ answered HTTP $status; preview not ready or not matching yet"
            sleep 30
          done
          cat smoke.txt
          if [ "$status" = "404" ] || [ "$status" = "000" ]; then
            reason="Cloudflare never served a preview here (HTTP $status). Check the Cloudflare Pages check on this PR: its build likely failed, and pushing the commit again retries it."
          else
            reason="The preview answers (HTTP $status) but does not match this commit's dist/."
          fi
          echo "$reason"
          { echo "### Preview failed the smoke test: $PREVIEW"; echo; echo "$reason"; echo; echo '```'; tail -n 40 smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Lighthouse (mobile)
        env:
          PREVIEW: ${{ steps.url.outputs.url }}
        run: |
          mkdir -p lighthouse
          for route in / /platform/ /investors-partners/; do
            name=$(echo "$route" | tr -c 'a-z0-9\n' '-' | sed 's/^-*//;s/-*$//'); name=${name:-home}
            npx --yes lighthouse@13.5.0 "$PREVIEW$route" --quiet --output=json --output=html \
              --output-path="lighthouse/$name" --chrome-flags="--headless=new --no-sandbox" || true
          done
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print('### Lighthouse, mobile (informational)')
          print('| Page | Performance | Accessibility | Best practices | SEO | LCP |')
          print('|---|---|---|---|---|---|')
          for path in sorted(glob.glob('lighthouse/*.report.json')):
              report = json.load(open(path, encoding='utf-8'))
              score = lambda key: round((report['categories'][key]['score'] or 0) * 100)
              lcp = report['audits']['largest-contentful-paint']['displayValue']
              page = report['finalDisplayedUrl'].split('.dev', 1)[-1] or '/'
              print(f"| {page} | {score('performance')} | {score('accessibility')} | {score('best-practices')} | {score('seo')} | {lcp} |")
          PY

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-pr-${{ github.event.pull_request.number }}
          path: lighthouse/
          retention-days: 14
          if-no-files-found: ignore
